<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TEAM 1030 · Map Analyzer</title><style>
*{box-sizing:border-box}body{margin:0;background:#090a10;color:#eeeaf8;font:14px Inter,Pretendard,Arial,sans-serif}header{height:58px;background:#12111a;border-bottom:1px solid #2e2a3b;display:flex;align-items:center;padding:0 28px}.brand{font-size:18px;font-weight:900}.brand b{color:#9c6dff}.phase{margin-left:auto;color:#8e879c;font-size:12px}main{max-width:1260px;margin:24px auto;padding:0 22px}.top{display:flex;align-items:end;justify-content:space-between;margin-bottom:18px}h1{font-size:24px;margin:0 0 6px}.sub{color:#918a9e}.status{color:#6de2a0;background:#10251c;border:1px solid #24513b;padding:7px 11px;border-radius:20px;font-weight:700}.layout{display:grid;grid-template-columns:minmax(520px,1fr) 330px;gap:18px}.panel{background:#14131c;border:1px solid #332f40;border-radius:12px;padding:16px}.map{position:relative;aspect-ratio:1;overflow:hidden;border:1px solid #524a62;border-radius:9px;background:linear-gradient(135deg,#183542 0 35%,#29283a 35% 64%,#493042 64%)}.map:before{content:"";position:absolute;inset:10%;border:22px solid rgba(15,17,22,.66);transform:rotate(-5deg);clip-path:polygon(0 0,100% 0,100% 23%,25% 23%,25% 78%,100% 78%,100% 100%,0 100%)}.river{position:absolute;inset:-20%;background:linear-gradient(135deg,transparent 43%,rgba(70,150,177,.45) 44% 53%,transparent 54%);transform:rotate(-3deg)}.lane{position:absolute;background:rgba(195,184,151,.19);height:5px;left:8%;right:8%;top:50%;transform:rotate(-45deg)}.trail{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.dot{position:absolute;width:25px;height:25px;border-radius:50%;transform:translate(-50%,-50%);display:grid;place-items:center;font-size:10px;font-weight:900;color:white;box-shadow:0 0 0 3px rgba(255,255,255,.16),0 4px 12px #000}.dot.blue{background:#159ee9}.dot.red{background:#ec405e}.dot.unknown{background:#a56df5}.controls{margin-top:14px}.actions{display:flex;align-items:center;gap:10px}.play{border:0;background:#8d5bea;color:white;border-radius:8px;padding:10px 18px;font-weight:800;cursor:pointer}.time{font-variant-numeric:tabular-nums;font-weight:800}input[type=range]{width:100%;accent-color:#9a67f5;margin:15px 0}.ticks{display:flex;justify-content:space-between;color:#716a7e;font-size:11px}.row{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #292634}.row:last-child{border:0}.label{color:#918a9e}.value{font-weight:750}.filters{display:flex;gap:7px;margin-top:12px}.filter{border:1px solid #3c364a;background:#201d29;color:#aaa3b6;border-radius:7px;padding:7px 9px}.filter.on{color:white;border-color:#7850bd;background:#302344}.legend{display:flex;gap:18px;margin-top:13px;color:#a69ead;font-size:12px}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}.notice{margin-top:14px;padding:12px;background:#111b25;border-left:3px solid #3c99d1;color:#9bb9ca;line-height:1.55}@media(max-width:900px){.layout{grid-template-columns:1fr}.top{align-items:start;gap:12px}.map{min-width:0}}
</style></head><body><header><div class="brand"><b>TEAM</b> 1030</div><div class="phase">PHASE 8 · MAP ANALYZER</div></header><main><div class="top"><div><h1>Map Analyzer</h1><div class="sub">실제 미니맵 Track을 시간 순서대로 재생합니다.</div></div><div class="status" id="status">● 데이터 확인 중</div></div><div class="layout"><section class="panel"><div class="map" id="map"><div class="river"></div><div class="lane"></div><svg class="trail" id="trail" viewBox="0 0 100 100" preserveAspectRatio="none"></svg></div><div class="controls"><div class="actions"><button class="play" id="play">▶ 재생</button><span class="time" id="time">00:00.000</span><span class="sub" id="frame">Frame 0 / 0</span></div><input id="slider" type="range" min="0" value="0"><div class="ticks"><span>START</span><span>현재 프레임 기준</span><span>END</span></div></div></section><aside class="panel"><div class="row"><span class="label">Session</span><span class="value" id="session">-</span></div><div class="row"><span class="label">전체 Track</span><span class="value" id="trackCount">-</span></div><div class="row"><span class="label">현재 표시</span><span class="value" id="visibleCount">-</span></div><div class="row"><span class="label">현재 소실</span><span class="value" id="lostCount">-</span></div><div class="filters"><button class="filter on" data-team="blue">파랑</button><button class="filter on" data-team="red">빨강</button><button class="filter on" data-team="unknown">미분류</button></div><div class="legend"><span><i style="background:#159ee9"></i>Blue</span><span><i style="background:#ec405e"></i>Red</span></div><div class="notice">보이지 않는 Track의 위치는 추정하지 않습니다. 소실된 아이콘은 지도에서 숨기고 상태만 기록합니다.</div></aside></div></main>
<script>
let data,index=0,timer=null,enabled=new Set(['blue','red','unknown']),history={};const $=s=>document.querySelector(s);function fmt(ms){let s=Math.floor(ms/1000),m=Math.floor(s/60);return String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0')+'.'+String(ms%1000).padStart(3,'0')}function draw(){let f=data.frames[index];$('#map').querySelectorAll('.dot').forEach(e=>e.remove());f.visible.filter(p=>enabled.has(p.team)).forEach(p=>{(history[p.id]??=[]).push([p.x,p.y]);let e=document.createElement('i');e.className='dot '+p.team;e.textContent='T'+p.id;e.style.left=p.x+'%';e.style.top=p.y+'%';$('#map').append(e)});$('#trail').innerHTML=Object.entries(history).map(([id,pts])=>{let p=f.visible.find(x=>x.id==id);if(!p||!enabled.has(p.team)||pts.length<2)return'';return `<polyline points="${pts.map(x=>x.join(',')).join(' ')}" fill="none" stroke="${p.team==='red'?'#ff5872':'#42baff'}" stroke-width=".65" opacity=".72"/>`}).join('');$('#slider').value=index;$('#time').textContent=fmt(f.timestampMs);$('#frame').textContent=`Frame ${index+1} / ${data.frameCount}`;$('#visibleCount').textContent=f.visible.length;$('#lostCount').textContent=f.lostTrackIds.length}function resetHistory(){history={};for(let i=0;i<index;i++)data.frames[i].visible.forEach(p=>(history[p.id]??=[]).push([p.x,p.y]))}async function load(){let wanted=new URLSearchParams(location.search).get('session');let path='map-session.json';if(wanted){let catalog=await fetch('sessions.json').then(r=>r.json());let entry=catalog.sessions.find(s=>s.sessionId===wanted);if(!entry)throw Error('session not found');path=entry.timeline}data=await fetch(path).then(r=>{if(!r.ok)throw Error('timeline load failed');return r.json()});$('#slider').max=data.frameCount-1;$('#session').textContent=data.sessionId;$('#trackCount').textContent=data.trackCount;$('#status').textContent='● 데이터 검증 완료';draw()}load().catch(()=>$('#status').textContent='데이터 로드 실패');$('#slider').oninput=e=>{index=+e.target.value;resetHistory();draw()};$('#play').onclick=()=>{if(!data)return;if(timer){clearInterval(timer);timer=null;$('#play').textContent='▶ 재생';return}$('#play').textContent='Ⅱ 일시정지';timer=setInterval(()=>{if(index>=data.frameCount-1){clearInterval(timer);timer=null;$('#play').textContent='▶ 재생';return}index++;draw()},500)};document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{b.classList.toggle('on');b.classList.contains('on')?enabled.add(b.dataset.team):enabled.delete(b.dataset.team);resetHistory();draw()});
</script></body></html>
